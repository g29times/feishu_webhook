<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>飞书网页助手</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      width: 320px;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    .header {
      text-align: center;
      margin-bottom: 20px;
    }
    .header h1 {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 5px;
    }
    .header p {
      font-size: 12px;
      opacity: 0.9;
    }
    .card {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 15px;
    }
    .card h3 {
      font-size: 14px;
      margin-bottom: 10px;
      font-weight: 600;
    }
    .card p {
      font-size: 13px;
      line-height: 1.6;
      opacity: 0.95;
    }
    .steps {
      list-style: none;
    }
    .steps li {
      font-size: 13px;
      line-height: 1.8;
      padding-left: 20px;
      position: relative;
      opacity: 0.95;
    }
    .steps li:before {
      content: "✓";
      position: absolute;
      left: 0;
      font-weight: bold;
    }
    .status {
      text-align: center;
      padding: 10px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
    }
    .footer {
      text-align: center;
      margin-top: 15px;
      font-size: 11px;
      opacity: 0.8;
    }
    .input-group {
      margin-bottom: 10px;
    }
    .input-group input {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.2);
      color: white;
      font-size: 12px;
      font-family: inherit;
      transition: all 0.2s;
    }
    .input-group textarea {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.2);
      color: white;
      font-size: 12px;
      font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', 'Consolas', 'source-code-pro', monospace;
      transition: all 0.2s;
      resize: vertical;
      min-height: 100px;
    }
    .input-group textarea:focus {
      outline: none;
      background: rgba(255, 255, 255, 0.25);
      border-color: rgba(255, 255, 255, 0.5);
    }
    .input-group input::placeholder,
    .input-group textarea::placeholder {
      color: rgba(255, 255, 255, 0.6);
    }
    .input-group label {
      display: block;
      font-size: 12px;
      margin-bottom: 6px;
      opacity: 0.9;
    }
    .help-text {
      font-size: 11px;
      opacity: 0.7;
      margin-top: 4px;
    }
    .btn {
      width: 100%;
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.9);
      color: #667eea;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn:hover {
      background: white;
      transform: translateY(-1px);
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    }
    .btn:active {
      transform: translateY(0);
    }
    .message {
      margin-top: 8px;
      font-size: 12px;
      text-align: center;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .message.show {
      opacity: 1;
    }
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      margin-bottom: 10px;
      font-size: 13px;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
    }
    .switch input { display: none; }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: rgba(255, 255, 255, 0.35);
      transition: .2s;
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.6);
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 2px;
      background-color: white;
      transition: .2s;
      border-radius: 50%;
      box-shadow: 0 1px 4px rgba(0,0,0,0.25);
    }
    input:checked + .slider {
      background: rgba(255, 255, 255, 0.65);
    }
    input:checked + .slider:before {
      transform: translateX(18px);
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>📝 飞书网页助手</h1>
    <p>快速收集网页灵感</p>
  </div>

  <div class="card">
    <h3>使用方法</h3>
    <ul class="steps">
      <li>在任意网页上选中文字</li>
      <li>点击出现的紫色圆形按钮</li>
      <li>选中的文字将发送到飞书</li>
      <li>https://botbuilder.feishu.cn/home</li>
    </ul>
  </div>

  <div class="card">
    <h3>Webhook配置</h3>
    <div class="toggle-row">
      <span>启用悬浮球</span>
      <label class="switch">
        <input type="checkbox" id="enableFloatingBall" />
        <span class="slider"></span>
      </label>
    </div>
    <div class="input-group">
      <label>Webhook 地址</label>
      <input 
        type="text" 
        id="webhookUrl" 
        placeholder="请输入 Webhook 地址"
      />
    </div>
    <div class="input-group">
      <label>请求体模版 (JSON)</label>
      <textarea 
        id="requestBody" 
        placeholder='{ "title": "{{title}}", "idea": "{{text}}", "labels": "{{labels}}", "url": "{{url}}" }'
      ></textarea>
      <div class="help-text">支持占位符: {{text}} 内容, {{title}} 标题, {{labels}} 标签, {{url}} 地址</div>
    </div>
    <button class="btn" id="saveBtn">💾 保存配置</button>
    <div class="message" id="message"></div>
  </div>

  <div class="status">
    ✅ 插件运行中
  </div>

  <div class="footer">
    v1.0 | 随时随地收集想法
  </div>

  <script src="popup.js"></script>
</body>
</html>
